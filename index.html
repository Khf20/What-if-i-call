<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#070605" />
		<title>What If I Call</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&amp;family=Space+Mono&amp;display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #070605;
				--ink: #f2ece1;
				--dim: rgba(242, 236, 225, 0.55);
				--faint: rgba(242, 236, 225, 0.3);
				--ghost: rgba(242, 236, 225, 0.16);
				--line: rgba(242, 236, 225, 0.12);
				--amber: #e0a458;
				--amber-soft: rgba(224, 164, 88, 0.55);
				--bass: 0;
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: var(--bg);
			}
			body {
				font-family: "Fraunces", serif;
				color: var(--ink);
				overflow: hidden;
				overscroll-behavior: none;
				-webkit-font-smoothing: antialiased;
			}
			::selection {
				background: var(--amber);
				color: #140b02;
			}
			.mono {
				font-family: "Space Mono", monospace;
			}

			.stage {
				position: fixed;
				inset: 0;
				overflow: hidden;
			}

			/* ---------- Latar film ---------- */
			.bg-video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				filter: brightness(0.46) saturate(0.95);
				transform: scale(calc(1.04 + var(--bass) * 0.03));
				transition: filter 1.6s ease;
			}
			.bg-video.scene-1 {
				filter: brightness(0.4) saturate(0.75) sepia(0.24);
			}
			.bg-video.scene-2 {
				filter: brightness(0.4) saturate(1.2) hue-rotate(-16deg);
			}
			.veil {
				position: absolute;
				inset: 0;
				background:
					radial-gradient(
						130% 100% at 50% 42%,
						transparent 38%,
						rgba(7, 6, 5, 0.62) 100%
					),
					linear-gradient(
						to bottom,
						rgba(7, 6, 5, 0.72),
						rgba(7, 6, 5, 0.08) 30%
					),
					linear-gradient(
						to top,
						rgba(7, 6, 5, 0.88),
						rgba(7, 6, 5, 0.12) 42%
					);
			}
			.scanlines {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 90;
				background: repeating-linear-gradient(
					0deg,
					transparent,
					transparent 3px,
					rgba(0, 0, 0, 0.02) 3px,
					rgba(0, 0, 0, 0.02) 5px
				);
			}
			.grain {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 89;
				opacity: 0.045;
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
			}

			/* ---------- Strip progres gaya cerita ---------- */
			.strip {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				z-index: 50;
				display: flex;
				gap: 6px;
				padding: calc(0.7rem + env(safe-area-inset-top)) 1rem 0.9rem;
				cursor: pointer;
				touch-action: none;
			}
			.segment {
				position: relative;
				flex: 1;
				height: 14px;
			}
			.segment::before {
				content: "";
				position: absolute;
				left: 0;
				right: 0;
				top: 50%;
				height: 2.5px;
				transform: translateY(-50%);
				border-radius: 2px;
				background: rgba(242, 236, 225, 0.22);
			}
			.segment-fill {
				position: absolute;
				left: 0;
				top: 50%;
				height: 2.5px;
				transform: translateY(-50%);
				width: 0%;
				border-radius: 2px;
				background: var(--ink);
			}
			.segment.is-active .segment-fill {
				background: var(--amber);
				box-shadow: 0 0 10px rgba(224, 164, 88, 0.6);
			}
			.time-bubble {
				position: absolute;
				top: calc(2.4rem + env(safe-area-inset-top));
				left: 50%;
				transform: translateX(-50%);
				z-index: 50;
				font-family: "Space Mono", monospace;
				font-size: 0.6rem;
				letter-spacing: 0.2em;
				color: var(--ink);
				text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
				opacity: 0;
				transition: opacity 0.3s ease;
				pointer-events: none;
				font-variant-numeric: tabular-nums;
			}
			.time-bubble.is-on {
				opacity: 1;
			}

			/* ---------- Tumpukan lirik ---------- */
			.stack-viewport {
				position: absolute;
				inset: 0;
				overflow: hidden;
				z-index: 30;
				transition: opacity 0.55s ease;
				-webkit-mask-image: linear-gradient(
					to bottom,
					transparent 4%,
					#000 24%,
					#000 72%,
					transparent 96%
				);
				mask-image: linear-gradient(
					to bottom,
					transparent 4%,
					#000 24%,
					#000 72%,
					transparent 96%
				);
			}
			.stack {
				position: absolute;
				left: 50%;
				width: min(90vw, 30rem);
				transform: translateX(-50%);
				transition: transform 0.38s cubic-bezier(0.3, 0.7, 0.2, 1);
				will-change: transform;
			}
			.stack-kicker {
				padding: 1.5rem 0 0.8rem;
				text-align: center;
				font-family: "Space Mono", monospace;
				font-size: 0.56rem;
				letter-spacing: 0.44em;
				text-transform: uppercase;
				color: var(--amber-soft);
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.stack-kicker.is-visible {
				opacity: 1;
			}
			.stack-line {
				margin: 0;
				padding: 0.5em 0;
				text-align: center;
				font-size: clamp(1.5rem, 7vw, 2.6rem);
				font-weight: 530;
				font-style: italic;
				line-height: 1.22;
				letter-spacing: -0.01em;
				color: rgba(242, 236, 225, 0.2);
				text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55);
				transition:
					color 0.26s ease,
					opacity 0.26s ease,
					text-shadow 0.26s ease;
			}
			@media (min-width: 700px) {
				.stack-line {
					font-size: clamp(1.9rem, 3.4vw, 2.9rem);
				}
			}
			.stack-line.is-past {
				color: rgba(242, 236, 225, 0.1);
			}
			.stack-line.is-near {
				color: rgba(242, 236, 225, 0.4);
			}
			.stack-line.is-active {
				color: var(--ink);
				text-shadow:
					0 0 30px rgba(0, 0, 0, 0.7),
					0 0 44px rgba(224, 164, 88, calc(0.08 + var(--bass) * 0.4));
			}
			.stack-line.is-held {
				opacity: 0.15;
			}
			.stack-line .k-word {
				background: linear-gradient(var(--ink), var(--ink)) no-repeat 0
					0;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: rgba(242, 236, 225, 0.2);
				color: rgba(242, 236, 225, 0.2);
				background-size: 0% 100%;
			}
			.stack-line.is-active .k-word.k-filled {
				-webkit-text-fill-color: var(--ink);
				color: var(--ink);
				background-size: 100% 100%;
			}

			/* ---------- Kartu judul bab ---------- */
			.scene-card {
				position: absolute;
				inset: 0;
				z-index: 40;
				display: grid;
				place-items: center;
				text-align: center;
				padding: 2rem;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s ease;
			}
			.scene-card.is-shown {
				opacity: 1;
			}
			.scene-card .kicker {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.7rem;
				font-family: "Space Mono", monospace;
				font-size: 0.58rem;
				letter-spacing: 0.4em;
				text-transform: uppercase;
				color: var(--amber);
				margin-bottom: 1.1rem;
			}
			.scene-card .kicker::before,
			.scene-card .kicker::after {
				content: "";
				width: 22px;
				height: 1px;
				background: var(--amber-soft);
			}
			.scene-card h2 {
				margin: 0;
				font-size: clamp(2rem, 9vw, 3.6rem);
				font-weight: 640;
				font-style: italic;
				letter-spacing: -0.02em;
				line-height: 1.05;
				text-shadow: 0 4px 40px rgba(0, 0, 0, 0.8);
			}
			body.card-show .stack-viewport {
				opacity: 0.05;
			}

			/* ---------- Tombol putar ---------- */
			.play-fab {
				position: absolute;
				left: 50%;
				bottom: calc(1.6rem + env(safe-area-inset-bottom));
				transform: translateX(-50%);
				z-index: 50;
				width: 58px;
				height: 58px;
				border-radius: 50%;
				border: 1px solid rgba(242, 236, 225, 0.28);
				background: rgba(7, 6, 5, 0.42);
				backdrop-filter: blur(10px);
				color: var(--ink);
				display: grid;
				place-items: center;
				cursor: pointer;
				transition:
					border-color 0.25s ease,
					transform 0.15s ease;
			}
			.play-fab:hover,
			.play-fab:focus-visible {
				border-color: rgba(242, 236, 225, 0.7);
			}
			.play-fab:focus-visible {
				outline: 1px solid var(--amber);
				outline-offset: 4px;
			}
			.play-fab:active {
				transform: translateX(-50%) scale(0.94);
			}
			.play-fab svg {
				width: 20px;
				height: 20px;
				display: block;
			}
			.play-fab .ic-pause {
				display: none;
			}
			.play-fab.is-playing .ic-play {
				display: none;
			}
			.play-fab.is-playing .ic-pause {
				display: block;
			}

			/* ---------- Intro & penutup ---------- */
			.overlay {
				position: fixed;
				inset: 0;
				z-index: 200;
				display: grid;
				place-items: center;
				padding: 2rem;
				background: var(--bg);
				text-align: center;
				transition:
					opacity 0.9s ease,
					visibility 0.9s ease;
			}
			.overlay::before {
				content: "";
				position: absolute;
				inset: 0.9rem;
				border: 1px solid rgba(242, 236, 225, 0.09);
				pointer-events: none;
			}
			.overlay.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			.overlay-inner {
				position: relative;
				max-width: 30rem;
			}
			.intro-title {
				margin: 0 0 1.4rem;
				font-size: clamp(2.9rem, 13vw, 6.4rem);
				font-weight: 860;
				font-style: italic;
				line-height: 0.94;
				letter-spacing: -0.035em;
			}
			.intro-title .q {
				color: var(--amber);
			}
			.overlay-copy {
				margin: 0 auto 2.6rem;
				max-width: 21rem;
				font-weight: 340;
				font-size: 0.92rem;
				line-height: 1.75;
				color: var(--dim);
			}
			.cta {
				position: relative;
				min-height: 50px;
				padding: 0 2rem;
				border: 1px solid rgba(242, 236, 225, 0.4);
				border-radius: 999px;
				background: transparent;
				color: var(--ink);
				font-family: "Space Mono", monospace;
				font-size: 0.62rem;
				letter-spacing: 0.3em;
				text-transform: uppercase;
				cursor: pointer;
				transition:
					background 0.25s ease,
					color 0.25s ease,
					border-color 0.25s ease;
			}
			.cta:hover,
			.cta:focus-visible {
				background: var(--ink);
				border-color: var(--ink);
				color: #17100a;
			}
			.cta:focus-visible {
				outline: 1px solid var(--amber);
				outline-offset: 5px;
			}
			.cta::before,
			.cta::after {
				content: "";
				position: absolute;
				inset: -1px;
				border-radius: 999px;
				border: 1px solid var(--amber-soft);
				opacity: 0;
				pointer-events: none;
				animation: ring-pulse 3s ease-out infinite;
			}
			.cta::after {
				animation-delay: 1.5s;
			}
			@keyframes ring-pulse {
				0% {
					opacity: 0.45;
					transform: scale(1);
				}
				75%,
				100% {
					opacity: 0;
					transform: scale(1.4);
				}
			}
			.overlay-foot {
				position: absolute;
				left: 0;
				right: 0;
				bottom: calc(1.5rem + env(safe-area-inset-bottom));
				font-family: "Space Mono", monospace;
				font-size: 0.54rem;
				letter-spacing: 0.34em;
				text-transform: uppercase;
				color: var(--ghost);
			}
			.ending-quote {
				margin: 0 0 0.9rem;
				font-size: clamp(1.7rem, 7vw, 3.2rem);
				font-weight: 560;
				font-style: italic;
				line-height: 1.2;
				letter-spacing: -0.015em;
			}
			.quote-credit {
				margin: 0 0 2.4rem;
				font-size: 0.58rem;
				letter-spacing: 0.32em;
				text-transform: uppercase;
				color: var(--faint);
			}

			.main-ui {
				transition:
					opacity 0.8s ease,
					visibility 0.8s ease;
			}
			body:not(.experience-started) .main-ui {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			@media (prefers-reduced-motion: reduce) {
				.bg-video,
				.stack,
				.stack-viewport,
				.scene-card,
				.cta::before,
				.cta::after,
				.time-bubble {
					transition: none !important;
					animation: none !important;
				}
			}
		</style>
	</head>
	<body>
		<div class="stage">
			<video
				id="bg-video"
				class="bg-video scene-0"
				autoplay
				muted
				loop
				playsinline
				preload="auto"
				aria-hidden="true"
			>
				<source src="vidio.mp4" type="video/mp4" />
			</video>
			<div class="veil" aria-hidden="true"></div>

			<!-- Lirik: seluruh konten layar -->
			<main class="main-ui stack-viewport" aria-live="polite">
				<div class="stack" id="stack"></div>
			</main>

			<!-- Kartu judul bab -->
			<div class="scene-card main-ui" id="scene-card" aria-hidden="true">
				<div>
					<p class="kicker" id="card-kicker">Fragmen pertama</p>
					<h2 id="card-title">Ruang di Antara Bintang</h2>
				</div>
			</div>

			<!-- Strip progres: sentuh bagian untuk pindah bab, seret untuk mencari -->
			<nav
				class="strip main-ui"
				id="strip"
				aria-label="Progres lagu — sentuh untuk pindah bagian, seret untuk mencari"
			>
				<div class="segment"><div class="segment-fill"></div></div>
				<div class="segment"><div class="segment-fill"></div></div>
				<div class="segment"><div class="segment-fill"></div></div>
			</nav>
			<div class="time-bubble" id="time-bubble">00:00 / 02:40</div>

			<!-- Satu-satunya tombol -->
			<button
				id="play-fab"
				class="play-fab main-ui"
				type="button"
				aria-label="Putar musik"
				aria-pressed="false"
			>
				<svg
					class="ic-play"
					viewBox="0 0 20 20"
					fill="currentColor"
					aria-hidden="true"
				>
					<path
						d="M6 3.8v12.4c0 .8.9 1.3 1.6.9l9.6-6.2c.6-.4.6-1.4 0-1.8L7.6 2.9c-.7-.4-1.6.1-1.6.9z"
					/>
				</svg>
				<svg
					class="ic-pause"
					viewBox="0 0 20 20"
					fill="currentColor"
					aria-hidden="true"
				>
					<rect x="4.5" y="3" width="4" height="14" rx="1.4" />
					<rect x="11.5" y="3" width="4" height="14" rx="1.4" />
				</svg>
			</button>
		</div>

		<!-- Intro -->
		<section id="intro" class="overlay" aria-label="Pembuka">
			<div class="overlay-inner">
				<h1 class="intro-title">
					What if I call<span class="q">?</span>
				</h1>
				<p class="overlay-copy">Biarkan lagunya yang menelepon.</p>
				<button id="enter" class="cta" type="button">Dengarkan</button>
			</div>
			<div class="overlay-foot">
				Alex Crichton &middot; Merry Christmas, I Miss You
			</div>
		</section>

		<!-- Penutup -->
		<section
			id="ending"
			class="overlay is-hidden"
			aria-label="Penutup"
			aria-hidden="true"
		>
			<div class="overlay-inner">
				<p class="ending-quote">
					&ldquo;I miss you in waves,<br />and tonight I'm
					drowning.&rdquo;
				</p>
				<p class="quote-credit mono">&mdash; Denice Envall</p>
				<button id="replay" class="cta" type="button">
					Putar Lagi
				</button>
			</div>
		</section>

		<div class="scanlines" aria-hidden="true"></div>
		<div class="grain" aria-hidden="true"></div>

		<audio id="song" preload="auto">
			<source src="What If I Call_spotdown.org.mp3" type="audio/mpeg" />
		</audio>

		<script>
			/* ============ Data ============ */
			// Tiga bab mengikuti alur lagu: dingin di luar → pertanyaan → pengakuan.
			const chapters = [
				{ kicker: "di pesta itu", title: "Colder Outside" },
				{ kicker: "pertanyaan yang menunggu", title: "What If I Call" },
				{ kicker: "pengakuan terakhir", title: "I Miss You" },
			];
			const chapterCues = [0, 57.93, 112.64];

			const songSections = [
				{
					label: "Verse 1",
					lines: [
						"So what if I call?",
						"And you pick up the phone",
						"And I use this holiday",
						"To make my way to your ghost",
					],
				},
				{
					label: "Verse 2",
					lines: [
						"You walked in the party, your coat was untied",
						"Slamming the door 'cause it's colder outside",
						"Now I won't forget that moment like the blink of an eye",
						"You're off to the beach now 'til the weather gets nice",
					],
				},
				{
					label: "Chorus",
					lines: [
						"But what if I call?",
						"And you pick up the phone",
						"And I use this holiday",
						"To make my way to your ghost",
						"Oh, what if you're lonely?",
						"And you know I am too",
						"And I get the chance to say",
						"I wish I didn't but I miss you",
						"I miss you",
					],
				},
				{
					label: "Bridge",
					lines: [
						"You know it's true",
						"Yeah, I miss you",
						"You know it's true",
					],
				},
				{
					label: "Final Chorus",
					lines: [
						"So what if I call?",
						"And you pick up the phone",
						"And I use this holiday",
						"To make my way to your ghost",
						"Oh, what if you're lonely",
						"And you know I am too",
						"And I get the chance to say",
						"I wish I didn't but I miss you",
						"I miss you",
					],
				},
			];

			// Timestamp LRC dari rekaman 2:40; satu nilai untuk awal tiap baris lirik.
			const lineCues = [
				2.91, 7.56, 12.36, 15.35, 23.71, 32.97, 41.32, 51.19, 57.93,
				62.42, 67.27, 70.29, 76.2, 80.71, 85.42, 88.22, 94.7, 96.49,
				103.66, 108.46, 112.64, 117.31, 122.07, 125.01, 131.12, 133.34,
				140.24, 143.31, 149.65,
			];
			const HOLD_FADE = 4.5;

			/* ============ Elemen ============ */
			const song = document.getElementById("song");
			const bgVideo = document.getElementById("bg-video");
			const playFab = document.getElementById("play-fab");
			const strip = document.getElementById("strip");
			const segments = Array.from(strip.querySelectorAll(".segment"));
			const segmentFills = Array.from(
				strip.querySelectorAll(".segment-fill"),
			);
			const timeBubble = document.getElementById("time-bubble");
			const stackEl = document.getElementById("stack");
			const sceneCard = document.getElementById("scene-card");
			const cardKicker = document.getElementById("card-kicker");
			const cardTitle = document.getElementById("card-title");
			const intro = document.getElementById("intro");
			const ending = document.getElementById("ending");
			const enterBtn = document.getElementById("enter");
			const replayBtn = document.getElementById("replay");

			const reducedMotion = window.matchMedia(
				"(prefers-reduced-motion: reduce)",
			).matches;

			/* ============ Analyser ============ */
			let audioContext = null;
			let analyser = null;
			let freqData = null;
			const levels = { bass: 0 };

			function ensureAudioGraph() {
				if (audioContext) return;
				try {
					const Ctx =
						window.AudioContext || window.webkitAudioContext;
					if (!Ctx) return;
					audioContext = new Ctx();
					const source = audioContext.createMediaElementSource(song);
					analyser = audioContext.createAnalyser();
					analyser.fftSize = 256;
					analyser.smoothingTimeConstant = 0.82;
					source.connect(analyser);
					analyser.connect(audioContext.destination);
					freqData = new Uint8Array(analyser.frequencyBinCount);
				} catch (error) {
					audioContext = null;
					analyser = null;
				}
			}

			function sampleLevels() {
				if (!analyser) return;
				analyser.getByteFrequencyData(freqData);
				let sum = 0;
				for (let i = 1; i < 8; i += 1) sum += freqData[i];
				levels.bass = sum / (7 * 255);
				document.documentElement.style.setProperty(
					"--bass",
					levels.bass.toFixed(3),
				);
			}

			/* ============ Loop visual ringan ============ */
			let visualRaf = null;
			function visualLoop() {
				sampleLevels();
				if (!song.paused && !song.ended) {
					visualRaf = requestAnimationFrame(visualLoop);
				}
			}
			function startVisualLoop() {
				if (visualRaf !== null) cancelAnimationFrame(visualRaf);
				visualRaf = requestAnimationFrame(visualLoop);
			}
			function stopVisualLoop() {
				if (visualRaf !== null) cancelAnimationFrame(visualRaf);
				visualRaf = null;
				document.documentElement.style.setProperty("--bass", "0");
			}

			/* ============ Waktu & strip progres ============ */
			function fmt(sec) {
				if (!Number.isFinite(sec)) return "00:00";
				const m = String(Math.floor(sec / 60)).padStart(2, "0");
				const s = String(Math.floor(sec % 60)).padStart(2, "0");
				return `${m}:${s}`;
			}

			function updateProgress() {
				const d = song.duration;
				if (!Number.isFinite(d) || d <= 0) return;
				const t = song.currentTime;
				segments.forEach((seg, i) => {
					const start = chapterCues[i];
					const end = chapterCues[i + 1] ?? d;
					const frac = Math.max(
						0,
						Math.min(1, (t - start) / (end - start)),
					);
					segmentFills[i].style.width = `${(frac * 100).toFixed(2)}%`;
					seg.classList.toggle("is-active", i === chapterIdx);
				});
				timeBubble.textContent = `${fmt(t)} / ${fmt(d)}`;
			}

			function seekRatio(r) {
				const d = song.duration;
				if (!Number.isFinite(d) || d <= 0) return;
				song.currentTime = Math.max(0, Math.min(d - 0.05, r * d));
				updateProgress();
				syncAll(true);
			}

			let stripDragging = false;
			let stripMoved = false;
			const stripRatio = (e) => {
				const rect = strip.getBoundingClientRect();
				return Math.max(
					0,
					Math.min(1, (e.clientX - rect.left) / rect.width),
				);
			};
			strip.addEventListener("pointerdown", (e) => {
				stripDragging = true;
				stripMoved = false;
				strip.setPointerCapture(e.pointerId);
				timeBubble.classList.add("is-on");
			});
			strip.addEventListener("pointermove", (e) => {
				if (!stripDragging) return;
				stripMoved = true;
				seekRatio(stripRatio(e));
			});
			strip.addEventListener("pointerup", (e) => {
				if (!stripDragging) return;
				stripDragging = false;
				timeBubble.classList.remove("is-on");
				if (!stripMoved) {
					const idx = Math.min(
						chapters.length - 1,
						Math.floor(stripRatio(e) * chapters.length),
					);
					jumpToChapter(idx);
				} else {
					setTimeout(() => timeBubble.classList.remove("is-on"), 500);
				}
			});
			strip.addEventListener("pointercancel", () => {
				stripDragging = false;
				timeBubble.classList.remove("is-on");
			});

			/* ============ Putar / jeda ============ */
			function updatePlayUI(playing) {
				playFab.classList.toggle("is-playing", playing);
				playFab.setAttribute("aria-pressed", String(playing));
				playFab.setAttribute(
					"aria-label",
					playing ? "Jeda musik" : "Putar musik",
				);
			}

			async function play() {
				ensureAudioGraph();
				if (audioContext && audioContext.state === "suspended") {
					audioContext.resume().catch(() => {});
				}
				try {
					await song.play();
					updatePlayUI(true);
				} catch (error) {
					updatePlayUI(false);
				}
			}

			function togglePlay() {
				if (song.paused) play();
				else song.pause();
			}

			playFab.addEventListener("click", togglePlay);
			song.addEventListener("play", () => {
				updatePlayUI(true);
				startSync();
				startVisualLoop();
				bgVideo.play().catch(() => {});
				if (!ending.classList.contains("is-hidden")) {
					ending.classList.add("is-hidden");
					ending.setAttribute("aria-hidden", "true");
				}
			});
			song.addEventListener("pause", () => {
				updatePlayUI(false);
				stopSync();
				stopVisualLoop();
				updateLyrics();
			});
			song.addEventListener("timeupdate", () => {
				syncAll(false);
				updateProgress();
			});
			song.addEventListener("loadedmetadata", () => {
				syncAll(true);
				updateProgress();
			});
			song.addEventListener("ended", showEnding);
			song.volume = 0.75;

			/* ============ Bab & kartu judul ============ */
			let chapterIdx = -1;
			let cardTimer = null;

			function showSceneCard(idx) {
				cardKicker.textContent = chapters[idx].kicker;
				cardTitle.textContent = chapters[idx].title;
				document.body.classList.add("card-show");
				sceneCard.classList.add("is-shown");
				sceneCard.setAttribute("aria-hidden", "false");
				if (cardTimer) clearTimeout(cardTimer);
				cardTimer = setTimeout(() => {
					document.body.classList.remove("card-show");
					sceneCard.classList.remove("is-shown");
					sceneCard.setAttribute("aria-hidden", "true");
				}, 2600);
			}

			function setScene(idx) {
				bgVideo.classList.remove("scene-0", "scene-1", "scene-2");
				bgVideo.classList.add(`scene-${idx}`);
			}

			function jumpToChapter(idx) {
				const next = Math.max(0, Math.min(chapters.length - 1, idx));
				const d = song.duration;
				if (Number.isFinite(d) && d > 0) {
					song.currentTime = Math.min(
						d - 0.05,
						chapterCues[next] + 0.01,
					);
				}
				if (next !== chapterIdx) {
					chapterIdx = next;
					setScene(next);
				}
				showSceneCard(next);
				syncAll(true);
				updateProgress();
			}

			function syncChapters() {
				if (!Number.isFinite(song.duration) || song.duration <= 0)
					return;
				let idx = 0;
				for (let i = 1; i < chapterCues.length; i += 1) {
					if (song.currentTime >= chapterCues[i]) idx = i;
				}
				if (idx !== chapterIdx) {
					chapterIdx = idx;
					setScene(idx);
				}
			}

			/* ============ Tumpukan lirik ============ */
			let stackItems = [];

			function buildStack() {
				stackEl.innerHTML = "";
				stackItems = [];
				let lineIdx = 0;
				songSections.forEach((section) => {
					const kick = document.createElement("p");
					kick.className = "stack-kicker";
					kick.textContent = section.label;
					stackEl.appendChild(kick);
					stackItems.push({
						el: kick,
						type: "kicker",
						line: lineIdx,
					});
					section.lines.forEach((text) => {
						const p = document.createElement("p");
						p.className = "stack-line";
						p.dataset.line = lineIdx;
						text.split(" ").forEach((word, i, arr) => {
							const span = document.createElement("span");
							span.className = "k-word";
							span.textContent = word;
							p.appendChild(span);
							if (i < arr.length - 1)
								p.appendChild(document.createTextNode(" "));
						});
						stackEl.appendChild(p);
						stackItems.push({ el: p, type: "line", line: lineIdx });
						lineIdx += 1;
					});
				});
			}

			function activeLineAt(t) {
				let active = -1;
				for (let i = 0; i < lineCues.length; i += 1) {
					if (t < lineCues[i]) break;
					active = i;
				}
				return active;
			}

			function positionStack(animate = true) {
				let active = stackEl.querySelector(".stack-line.is-active");
				if (!active) {
					// Sebelum lirik pertama, pusatkan baris pembuka.
					active = stackEl.querySelector(".stack-line");
				}
				if (!active) return;
				if (!animate) stackEl.style.transition = "none";
				const viewport = stackEl.parentElement.clientHeight;
				const target =
					active.offsetTop +
					active.offsetHeight / 2 -
					viewport / 2 -
					viewport * 0.04;
				stackEl.style.transform = `translate(-50%, ${(-target).toFixed(1)}px)`;
				if (!animate) {
					void stackEl.offsetHeight;
					stackEl.style.transition = "";
				}
			}

			function fillWords(lineEl, t) {
				const idx = Number(lineEl.dataset.line);
				const start = lineCues[idx];
				const words = lineEl.querySelectorAll(".k-word");
				const next =
					idx + 1 < lineCues.length ? lineCues[idx + 1] : start + 4;
				// Isi kata dengan kecepatan menyanyi (~0,5 dtk/kata),
				// bukan meratakannya sampai baris berikutnya muncul.
				const sing = Math.max(
					1.2,
					Math.min(next - start - 0.25, words.length * 0.5),
				);
				const frac = Math.max(0, Math.min(1, (t - start) / sing));
				const filled = Math.floor(frac * words.length);
				words.forEach((w, i) => {
					w.classList.toggle("k-filled", i < filled);
					if (i === filled && filled < words.length) {
						w.style.backgroundSize = `${((frac * words.length - filled) * 100).toFixed(1)}% 100%`;
					} else if (i >= filled) {
						w.style.backgroundSize = "0% 100%";
					}
				});
			}

			let lastActive = -1;
			function updateLyrics() {
				if (!Number.isFinite(song.duration)) return;
				const t = song.currentTime;
				const active = activeLineAt(t);
				if (active !== lastActive) {
					lastActive = active;
					stackItems.forEach((item) => {
						if (item.type === "line") {
							const isActive = item.line === active;
							item.el.classList.toggle("is-active", isActive);
							item.el.classList.toggle(
								"is-past",
								active >= 0 && item.line < active,
							);
							item.el.classList.toggle(
								"is-near",
								active >= 0 &&
									item.line > active &&
									item.line <= active + 2,
							);
							item.el.classList.remove("is-held");
							// Bersihkan sisa isian karaoke di SEMUA baris —
							// style inline background-size tidak tertimpa CSS.
							item.el.querySelectorAll(".k-word").forEach((w) => {
								w.classList.remove("k-filled");
								w.style.backgroundSize = "0% 100%";
							});
						} else {
							item.el.classList.toggle(
								"is-visible",
								active >= 0 && item.line === active,
							);
						}
					});
					positionStack(true);
				}
				if (active >= 0 && !song.paused) {
					const lineEl = stackEl.querySelector(
						`.stack-line[data-line="${active}"]`,
					);
					if (lineEl) {
						fillWords(lineEl, t);
						const end =
							active + 1 < lineCues.length
								? lineCues[active + 1]
								: t + 30;
						lineEl.classList.toggle("is-held", t > end + HOLD_FADE);
					}
				}
			}

			function syncAll(forcePosition) {
				syncChapters();
				updateLyrics();
				if (forcePosition) positionStack(false);
			}

			let syncRaf = null;
			function runSync() {
				syncAll(false);
				updateProgress();
				if (!song.paused && !song.ended)
					syncRaf = requestAnimationFrame(runSync);
			}
			function startSync() {
				if (syncRaf) cancelAnimationFrame(syncRaf);
				syncRaf = requestAnimationFrame(runSync);
			}
			function stopSync() {
				if (syncRaf) cancelAnimationFrame(syncRaf);
				syncRaf = null;
			}

			/* ============ Geser antar bab (sentuh) ============ */
			let touchStart = null;
			document.addEventListener(
				"touchstart",
				(e) => {
					if (e.target.closest(".strip")) return;
					const t = e.changedTouches[0];
					touchStart = { x: t.clientX, y: t.clientY };
				},
				{ passive: true },
			);
			document.addEventListener(
				"touchend",
				(e) => {
					if (!touchStart) return;
					const t = e.changedTouches[0];
					const dx = t.clientX - touchStart.x;
					const dy = t.clientY - touchStart.y;
					touchStart = null;
					if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy))
						return;
					jumpToChapter(chapterIdx + (dx < 0 ? 1 : -1));
				},
				{ passive: true },
			);

			/* ============ Keyboard ============ */
			document.addEventListener("keydown", (e) => {
				if (
					e.target instanceof HTMLElement &&
					(e.target.tagName === "INPUT" ||
						e.target.tagName === "TEXTAREA")
				)
					return;
				if (e.key === " " && !e.repeat) {
					const tag =
						e.target instanceof HTMLElement ? e.target.tagName : "";
					if (tag === "BUTTON" || tag === "A") return;
					e.preventDefault();
					togglePlay();
				} else if (e.key === "ArrowRight") {
					jumpToChapter(chapterIdx + 1);
				} else if (e.key === "ArrowLeft") {
					jumpToChapter(chapterIdx - 1);
				}
			});

			/* ============ Intro / penutup ============ */
			enterBtn.addEventListener("click", () => {
				document.body.classList.add("experience-started");
				intro.classList.add("is-hidden");
				intro.setAttribute("aria-hidden", "true");
				bgVideo.play().catch(() => {});
				showSceneCard(0);
				play();
			});

			function showEnding() {
				ending.classList.remove("is-hidden");
				ending.setAttribute("aria-hidden", "false");
				updatePlayUI(false);
			}

			replayBtn.addEventListener("click", () => {
				ending.classList.add("is-hidden");
				ending.setAttribute("aria-hidden", "true");
				song.currentTime = 0;
				lastActive = -1;
				showSceneCard(0);
				play();
			});

			/* ============ Media Session ============ */
			if ("mediaSession" in navigator) {
				navigator.mediaSession.metadata = new MediaMetadata({
					title: "What If I Call",
					artist: "Alex Crichton",
					album: "Merry Christmas, I Miss You",
				});
				navigator.mediaSession.setActionHandler("play", play);
				navigator.mediaSession.setActionHandler("pause", () =>
					song.pause(),
				);
			}

			/* ============ Init ============ */
			buildStack();
			setScene(0);
			chapterIdx = 0;
			window.addEventListener("resize", () => positionStack(false));
			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(() => positionStack(false));
			}
			updateLyrics();
		</script>
	</body>
</html>
