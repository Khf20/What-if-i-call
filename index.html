				>
					<span aria-hidden="true">◎</span>
					<span id="focus-label">Fokus</span>
				</button>
			</div>
			<!-- Main content -->
			<div
				class="main-content absolute inset-0 z-20 flex flex-col justify-end p-6 md:p-12 lg:p-16"
			>
				<!-- Lyrics area -->
				<div class="lyrics-content mb-8 max-w-3xl">
					<div id="lyrics-container" class="lyrics-panel mb-7">
						<p
							id="track-kicker"
							class="track-kicker mono text-[10px] uppercase tracking-[0.35em] mb-2"
						></p>
						<h2
							id="lyrics-heading"
							class="lyrics-heading text-3xl md:text-5xl font-bold leading-none mb-5"
						></h2>
						<p
							id="lyrics-text"
							class="text-lg md:text-xl leading-relaxed font-light"
							style="
								color: rgba(255, 255, 255, 0.85);
								font-family: &quot;Fraunces&quot;, serif;
							"
						></p>
					</div>
					<!-- Lyric navigation -->
					<div
						class="track-navigation flex gap-3 flex-wrap"
						role="tablist"
						aria-label="Pilih bagian kata"
					>
						<button
							class="track-tab mono text-xs transition-all tab-active"
							type="button"
							role="tab"
							aria-selected="true"
							onclick="switchTrack(0)"
						>
							<span class="track-number">01</span>
							<span class="track-name">Ruang Malam</span>
						</button>
						<button
							class="track-tab mono text-xs transition-all"
							type="button"
							role="tab"
							aria-selected="false"
							onclick="switchTrack(1)"
						>
							<span class="track-number">02</span>
							<span class="track-name">Usai Gerimis</span>
						</button>
						<button
							class="track-tab mono text-xs transition-all"
							type="button"
							role="tab"
							aria-selected="false"
							onclick="switchTrack(2)"
						>
							<span class="track-number">03</span>
							<span class="track-name">Frekuensi</span>
						</button>
					</div>
				</div>
				<!-- Bottom bar -->
				<div
					class="bottom-bar flex items-center justify-between border-t border-white/10 pt-4"
				>
					<p
						data-template-id="credit-text"
						class="canva-text mono text-xs"
					></p>
					<p
						data-template-id="track-time"
						class="canva-text mono text-xs"
					></p>
				</div>
			</div>
		</div>
		<section
			id="focus-lyrics-screen"
			class="focus-lyrics-overlay"
			aria-label="Lirik asli What If I Call"
			aria-hidden="true"
		>
			<div class="focus-lyrics-shell">
				<button
					id="focus-close"
					class="focus-close"
					type="button"
					aria-label="Tutup lirik"
				>
					×
				</button>
				<div
					id="original-lyrics"
					class="original-lyrics"
					aria-live="polite"
				></div>
			</div>
		</section>
		<section
			id="ending-screen"
			class="experience-overlay ending-overlay"
			aria-label="Penutup"
			aria-hidden="true"
		>
			<div class="experience-card">
				<p class="experience-eyebrow mono">Sampai di penghujung</p>
				<p class="ending-quote">
					“Beberapa kata hanya berani hidup di dalam lagu.”
				</p>
				<button
					id="replay-experience"
					class="experience-button"
					type="button"
				>
					Putar Lagi
				</button>
			</div>
		</section>
		<script
			src="/_sdk/9d3258af1f44fbf1.editing_sdk.js"
			integrity="sha512-3+HAndrk+HZiTGp2ISu+/bgYK1Xci+cLW89chzrkSCXjd9L9cNh/u9apmMgkep6XBKvCauldOAnZkyNhCjybeA=="
		></script>
		<script>
			const tracks = [
				{
					chapter: "Fragmen pertama",
					title: "Ruang di Antara Bintang",
					lyrics: "Malam ini bintang bersinar terang\nMenerangi jalan yang ku tempuh\nMelodi mengalun di keheningan\nMembawa hati ke tempat teduh\n\nDengarkan suara angin bernyanyi\nMembisikkan kata yang tak terucap",
				},
				{
					chapter: "Fragmen kedua",
					title: "Setelah Gerimis Reda",
					lyrics: "Hujan turun membasahi bumi\nSeperti air mata yang jatuh perlahan\nNamun di balik awan yang kelabu\nMatahari tetap menanti di sana\n\nKita berbaring di bawah langit malam\nDua jiwa yang menyatu dalam irama",
				},
				{
					chapter: "Fragmen ketiga",
					title: "Frekuensi yang Tertinggal",
					lyrics: "Langkah kaki di jalanan sunyi\nGema musik dari kejauhan\nSetiap detik terasa bermakna\nSaat nada bertemu dengan rasa\n\nBiarkan musik menjadi bahasa\nYang menghubungkan hati ke hati",
				},
			];

			const originalLyrics = [
				{
					section: "Verse 1",
					lines: [
						"So what if I call?",
						"And you pick up the phone?",
						"And I use this holiday",
						"To make my way to your ghost",
					],
				},
				{
					section: "Verse 2",
					lines: [
						"You walked in the party, your coat was untied",
						"Slammin' the door 'cause it's colder outside",
						"Now I won't forget that moment like the blink of an eye",
						"You're off to the beach now 'til the weather gets nice",
					],
				},
				{
					section: "Chorus",
					lines: [
						"But what if I call?",
						"And you pick up the phone?",
						"And I use this holiday to make my way to your ghost",
						"But, what if you're lonely?",
						"And you know I am too?",
						"And I get the chance to say ‘I wish I didn't, but I miss you’",
						"I miss you",
					],
				},
				{
					section: "Bridge",
					lines: [
						"You know it's true",
						"Yeah, I miss you",
						"You know it's true",
					],
				},
				{
					section: "Chorus",
					lines: [
						"So, what if I call?",
						"And you pick up the phone?",
						"And I use this holiday to make my way to your ghost",
						"But, what if you're lonely?",
						"And you know I am too?",
						"And I get the chance to say ‘I wish I didn't, but I miss you’",
						"I miss you",
					],
				},
			];

			let current = -1;
			let touchStart = null;
			const backgroundAudio = document.getElementById("background-audio");
			const backgroundVideo = document.getElementById("background-video");
			const audioToggle = document.getElementById("audio-toggle");
			const audioLabel = document.getElementById("audio-label");
			const focusToggle = document.getElementById("focus-toggle");
			const focusLabel = document.getElementById("focus-label");
			const enterButton = document.getElementById("enter-experience");
			const introScreen = document.getElementById("experience-intro");
			const replayButton = document.getElementById("replay-experience");
			const endingScreen = document.getElementById("ending-screen");
			const focusLyricsScreen = document.getElementById(
				"focus-lyrics-screen",
			);
			const focusClose = document.getElementById("focus-close");
			const originalLyricsContainer =
				document.getElementById("original-lyrics");
			const sceneFlash = document.getElementById("scene-flash");
			const mainContent = document.querySelector(".main-content");

			function updateAudioControl(isPlaying) {
				audioToggle.classList.toggle("is-playing", isPlaying);
				audioToggle.setAttribute("aria-pressed", String(isPlaying));
				audioToggle.setAttribute(
					"aria-label",
					isPlaying ? "Jeda musik" : "Putar musik",
				);
				audioLabel.textContent = isPlaying
					? "Jeda musik"
					: "Putar musik";
			}

			async function playAudio() {
				try {
					await backgroundAudio.play();
					updateAudioControl(true);
				} catch (error) {
					updateAudioControl(false);
				}
			}

			function toggleAudio() {
				if (backgroundAudio.paused) {
					playAudio();
				} else {
					backgroundAudio.pause();
				}
			}

			function updateVideoScene(idx) {
				backgroundVideo.classList.remove(
					"scene-0",
					"scene-1",
					"scene-2",
				);
				backgroundVideo.classList.add(`scene-${idx}`);
				sceneFlash.classList.remove("is-changing");
				void sceneFlash.offsetWidth;
				sceneFlash.classList.add("is-changing");
			}

			function switchTrack(idx, seekToSection = true) {
				const next = Math.max(0, Math.min(tracks.length - 1, idx));
				if (
					seekToSection &&
					Number.isFinite(backgroundAudio.duration)
				) {
					backgroundAudio.currentTime =
						(backgroundAudio.duration / tracks.length) * next +
						0.01;
				}
				if (current === next) {
					updateActiveLine(0);
					return;
				}
				current = next;
				document.querySelectorAll(".track-tab").forEach((btn, i) => {
					const isActive = i === next;
					btn.classList.toggle("tab-active", isActive);
					btn.setAttribute("aria-selected", String(isActive));
				});
				renderLyrics(tracks[next]);
				updateVideoScene(next);
			}

			function renderLyrics(track) {
				const container = document.getElementById("lyrics-text");
				const heading = document.getElementById("lyrics-heading");
				const kicker = document.getElementById("track-kicker");
				let syncIndex = 0;
				container.innerHTML = "";
				heading.textContent = track.title;
				kicker.textContent = track.chapter;
				heading.classList.remove("fade-in");
				void heading.offsetWidth;
				heading.classList.add("fade-in");
				track.lyrics.split("\n").forEach((line, i) => {
					const span = document.createElement("span");
					span.className = "lyrics-line block";
					span.style.animationDelay = i * 0.08 + "s";
					span.textContent = line || "\u00A0";
					if (line.trim()) {
						span.dataset.lineIndex = syncIndex;
						syncIndex += 1;
					} else {
						span.classList.add("lyrics-gap");
					}
					container.appendChild(span);
				});
				updateActiveLine(0);
			}

			function updateActiveLine(activeIndex) {
				document
					.querySelectorAll(".lyrics-line[data-line-index]")
					.forEach((line) => {
						const index = Number(line.dataset.lineIndex);
						line.classList.toggle(
							"is-active",
							index === activeIndex,
						);
						line.classList.toggle("is-past", index < activeIndex);
					});
			}

			function renderOriginalLyrics() {
				let lineIndex = 0;
				originalLyricsContainer.innerHTML = "";
				originalLyrics.forEach((group) => {
					const section = document.createElement("section");
					const label = document.createElement("h3");
					label.className = "original-section-label";
					label.textContent = group.section;
					section.className = "original-section";
					section.appendChild(label);
					group.lines.forEach((text) => {
						const line = document.createElement("p");
						line.className = "original-line";
						line.dataset.originalIndex = lineIndex;
						line.textContent = text;
						section.appendChild(line);
						lineIndex += 1;
					});
					originalLyricsContainer.appendChild(section);
				});
			}

			function updateOriginalLyrics(progress) {
				const totalLines = originalLyrics.reduce(
					(total, group) => total + group.lines.length,
					0,
				);
				const nextActiveLine = Math.min(
					totalLines - 1,
					Math.floor(progress * totalLines),
				);
				document.querySelectorAll(".original-line").forEach((line) => {
					const index = Number(line.dataset.originalIndex);
					line.classList.toggle(
						"is-active",
						index === nextActiveLine,
					);
				});
			}

			function syncLyricsToAudio() {
				if (
					!Number.isFinite(backgroundAudio.duration) ||
					!backgroundAudio.duration
				)
					return;
				const progress = Math.min(
					backgroundAudio.currentTime / backgroundAudio.duration,
					0.999999,
				);
				const trackProgress = progress * tracks.length;
				const trackIndex = Math.floor(trackProgress);
				if (trackIndex !== current) switchTrack(trackIndex, false);
				const lineCount = tracks[trackIndex].lyrics
					.split("\n")
					.filter((line) => line.trim()).length;
				const lineIndex = Math.min(
					lineCount - 1,
					Math.floor((trackProgress - trackIndex) * lineCount),
				);
				updateActiveLine(lineIndex);
				updateOriginalLyrics(progress);
			}

			function toggleFocusMode() {
				const isFocused = document.body.classList.toggle("focus-mode");
				focusToggle.setAttribute("aria-pressed", String(isFocused));
				focusToggle.setAttribute(
					"aria-label",
					isFocused
						? "Keluar dari mode fokus"
						: "Aktifkan mode fokus",
				);
				focusLabel.textContent = isFocused ? "Keluar" : "Fokus";
				focusLyricsScreen.setAttribute(
					"aria-hidden",
					String(!isFocused),
				);
				if (isFocused) {
					syncLyricsToAudio();
					focusClose.focus();
				} else {
					focusToggle.focus();
				}
			}

			function showEnding() {
				if (document.body.classList.contains("focus-mode")) {
					toggleFocusMode();
				}
				endingScreen.classList.add("is-visible");
				endingScreen.setAttribute("aria-hidden", "false");
				updateAudioControl(false);
			}

			backgroundAudio.volume = 0.7;
			audioToggle.addEventListener("click", toggleAudio);
			focusToggle.addEventListener("click", toggleFocusMode);
			focusClose.addEventListener("click", toggleFocusMode);
			backgroundAudio.addEventListener("play", () =>
				updateAudioControl(true),
			);
			backgroundAudio.addEventListener("pause", () =>
				updateAudioControl(false),
			);
			backgroundAudio.addEventListener("timeupdate", syncLyricsToAudio);
			backgroundAudio.addEventListener(
				"loadedmetadata",
				syncLyricsToAudio,
			);
			backgroundAudio.addEventListener("ended", showEnding);

			enterButton.addEventListener("click", () => {
				document.body.classList.add("experience-started");
				introScreen.setAttribute("aria-hidden", "true");
				backgroundVideo.play().catch(() => {});
				playAudio();
			});

			replayButton.addEventListener("click", () => {
				endingScreen.classList.remove("is-visible");
				endingScreen.setAttribute("aria-hidden", "true");
				backgroundAudio.currentTime = 0;
				switchTrack(0, false);
				playAudio();
			});

			mainContent.addEventListener(
				"touchstart",
				(event) => {
					if (event.target.closest(".track-navigation")) return;
					const touch = event.changedTouches[0];
					touchStart = { x: touch.clientX, y: touch.clientY };
				},
				{ passive: true },
			);
			mainContent.addEventListener(
				"touchend",
				(event) => {
					if (!touchStart) return;
					const touch = event.changedTouches[0];
					const deltaX = touch.clientX - touchStart.x;
					const deltaY = touch.clientY - touchStart.y;
					touchStart = null;
					if (
						Math.abs(deltaX) < 55 ||
						Math.abs(deltaX) < Math.abs(deltaY)
					)
						return;
					const nextTrack = deltaX < 0 ? current + 1 : current - 1;
					if (nextTrack >= 0 && nextTrack < tracks.length) {
						switchTrack(nextTrack);
					}
				},
				{ passive: true },
			);

			document.addEventListener("keydown", (event) => {
				if (
					event.key === "Escape" &&
					document.body.classList.contains("focus-mode")
				) {
					toggleFocusMode();
				}
			});

			renderOriginalLyrics();
			switchTrack(0, false);
			updateOriginalLyrics(0);
		</script>
	</body>
</html>
