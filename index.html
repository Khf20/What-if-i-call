<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#070605" />
		<title>What If I Call</title>
		<meta
			name="description"
			content="Lirik What If I Call — Alex Crichton, dengan karaoke yang mengikuti lagu."
		/>
		<link rel="icon" type="image/png" href="icon-512.png" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />

		<!-- Pratinjau saat link dibagikan (WhatsApp, Instagram, X, dll.) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="What If I Call?" />
		<meta property="og:description" content="Biarkan lagunya yang menelepon." />
		<meta property="og:url" content="https://khf20.github.io/What-if-i-call/" />
		<meta
			property="og:image"
			content="https://khf20.github.io/What-if-i-call/og-image.png"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&amp;family=Space+Mono&amp;display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #070605;
				--ink: #f2ece1;
				--dim: rgba(242, 236, 225, 0.55);
				--faint: rgba(242, 236, 225, 0.3);
				--ghost: rgba(242, 236, 225, 0.16);
				--line: rgba(242, 236, 225, 0.12);
				--amber: #e0a458;
				--amber-soft: rgba(224, 164, 88, 0.55);
				--bass: 0;
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: var(--bg);
			}
			body {
				font-family: "Fraunces", serif;
				color: var(--ink);
				overflow: hidden;
				overscroll-behavior: none;
				-webkit-font-smoothing: antialiased;
			}
			::selection {
				background: var(--amber);
				color: #140b02;
			}
			.mono {
				font-family: "Space Mono", monospace;
			}

			.stage {
				position: fixed;
				inset: 0;
				overflow: hidden;
			}

			/* ---------- Latar film ---------- */
			.bg-video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				filter: brightness(0.46) saturate(0.95);
				transform: scale(calc(1.04 + var(--bass) * 0.03));
				transition: filter 1.6s ease;
			}
			.bg-video.scene-1 {
				filter: brightness(0.4) saturate(0.75) sepia(0.24);
			}
			.bg-video.scene-2 {
				filter: brightness(0.4) saturate(1.2) hue-rotate(-16deg);
			}
			.veil {
				position: absolute;
				inset: 0;
				background:
					radial-gradient(
						130% 100% at 50% 42%,
						transparent 38%,
						rgba(7, 6, 5, 0.62) 100%
					),
					linear-gradient(
						to bottom,
						rgba(7, 6, 5, 0.72),
						rgba(7, 6, 5, 0.08) 30%
					),
					linear-gradient(
						to top,
						rgba(7, 6, 5, 0.88),
						rgba(7, 6, 5, 0.12) 42%
					);
			}
			.scanlines {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 90;
				background: repeating-linear-gradient(
					0deg,
					transparent,
					transparent 3px,
					rgba(0, 0, 0, 0.02) 3px,
					rgba(0, 0, 0, 0.02) 5px
				);
			}
			.grain {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 89;
				opacity: 0.045;
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
			}

			/* ---------- Strip progres gaya cerita ---------- */
			.strip {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				z-index: 50;
				display: flex;
				gap: 6px;
				padding: calc(0.7rem + env(safe-area-inset-top)) 1rem 0.9rem;
				cursor: pointer;
				touch-action: none;
			}
			.segment {
				position: relative;
				flex: 1;
				height: 14px;
				padding: 0;
				border: 0;
				background: none;
				cursor: pointer;
			}
			.segment:focus-visible {
				outline: 1px solid var(--amber);
				outline-offset: 3px;
				border-radius: 3px;
			}
			.segment::before {
				content: "";
				position: absolute;
				left: 0;
				right: 0;
				top: 50%;
				height: 2.5px;
				transform: translateY(-50%);
				border-radius: 2px;
				background: rgba(242, 236, 225, 0.22);
			}
			.segment-fill {
				position: absolute;
				left: 0;
				top: 50%;
				height: 2.5px;
				transform: translateY(-50%);
				width: 0%;
				border-radius: 2px;
				background: var(--ink);
			}
			.segment.is-active .segment-fill {
				background: var(--amber);
				box-shadow: 0 0 10px rgba(224, 164, 88, 0.6);
			}
			.time-bubble {
				position: absolute;
				top: calc(2.4rem + env(safe-area-inset-top));
				left: 50%;
				transform: translateX(-50%);
				z-index: 50;
				font-family: "Space Mono", monospace;
				font-size: 0.6rem;
				letter-spacing: 0.2em;
				color: var(--ink);
				text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
				opacity: 0;
				transition: opacity 0.3s ease;
				pointer-events: none;
				font-variant-numeric: tabular-nums;
			}
			.time-bubble.is-on {
				opacity: 1;
			}

			/* ---------- Tumpukan lirik ---------- */
			.stack-viewport {
				position: absolute;
				inset: 0;
				overflow: hidden;
				z-index: 30;
				transition: opacity 0.55s ease;
				-webkit-mask-image: linear-gradient(
					to bottom,
					transparent 4%,
					#000 24%,
					#000 72%,
					transparent 96%
				);
				mask-image: linear-gradient(
					to bottom,
					transparent 4%,
					#000 24%,
					#000 72%,
					transparent 96%
				);
			}
			.stack {
				position: absolute;
				left: 50%;
				width: min(90vw, 30rem);
				transform: translateX(-50%);
				transition: transform 0.38s cubic-bezier(0.3, 0.7, 0.2, 1);
				will-change: transform;
			}
			.stack-kicker {
				padding: 1.5rem 0 0.8rem;
				text-align: center;
				font-family: "Space Mono", monospace;
				font-size: 0.56rem;
				letter-spacing: 0.44em;
				text-transform: uppercase;
				color: var(--amber-soft);
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.stack-kicker.is-visible {
				opacity: 1;
			}
			.stack-line {
				margin: 0;
				padding: 0.5em 0;
				text-align: center;
				font-size: clamp(1.5rem, 7vw, 2.6rem);
				font-weight: 530;
				font-style: italic;
				line-height: 1.22;
				letter-spacing: -0.01em;
				color: rgba(242, 236, 225, 0.2);
				text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55);
				transition:
					color 0.26s ease,
					opacity 0.26s ease,
					text-shadow 0.26s ease;
			}
			@media (min-width: 700px) {
				.stack-line {
					font-size: clamp(1.9rem, 3.4vw, 2.9rem);
				}
			}
			.stack-line.is-past {
				color: rgba(242, 236, 225, 0.1);
			}
			.stack-line.is-near {
				color: rgba(242, 236, 225, 0.4);
			}
			.stack-line.is-active {
				color: var(--ink);
				text-shadow:
					0 0 30px rgba(0, 0, 0, 0.7),
					0 0 44px rgba(224, 164, 88, calc(0.08 + var(--bass) * 0.4));
			}
			.stack-line.is-held {
				opacity: 0.15;
			}
			.stack-line .k-word {
				background: linear-gradient(var(--ink), var(--ink)) no-repeat 0
					0;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: rgba(242, 236, 225, 0.2);
				color: rgba(242, 236, 225, 0.2);
				background-size: 0% 100%;
			}
			.stack-line.is-active .k-word.k-filled {
				-webkit-text-fill-color: var(--ink);
				color: var(--ink);
				background-size: 100% 100%;
			}

			/* ---------- Kartu judul bab ---------- */
			.scene-card {
				position: absolute;
				inset: 0;
				z-index: 40;
				display: grid;
				place-items: center;
				text-align: center;
				padding: 2rem;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s ease;
			}
			.scene-card.is-shown {
				opacity: 1;
			}
			.scene-card .kicker {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.7rem;
				font-family: "Space Mono", monospace;
				font-size: 0.58rem;
				letter-spacing: 0.4em;
				text-transform: uppercase;
				color: var(--amber);
				margin-bottom: 1.1rem;
			}
			.scene-card .kicker::before,
			.scene-card .kicker::after {
				content: "";
				width: 22px;
				height: 1px;
				background: var(--amber-soft);
			}
			.scene-card h2 {
				margin: 0;
				font-size: clamp(2rem, 9vw, 3.6rem);
				font-weight: 640;
				font-style: italic;
				letter-spacing: -0.02em;
				line-height: 1.05;
				text-shadow: 0 4px 40px rgba(0, 0, 0, 0.8);
			}
			body.card-show .stack-viewport {
				opacity: 0.05;
			}

			/* ---------- Tombol putar ---------- */
			.play-fab {
				position: absolute;
				left: 50%;
				bottom: calc(1.6rem + env(safe-area-inset-bottom));
				transform: translateX(-50%);
				z-index: 50;
				width: 58px;
				height: 58px;
				border-radius: 50%;
				border: 1px solid rgba(242, 236, 225, 0.28);
				background: rgba(7, 6, 5, 0.42);
				backdrop-filter: blur(10px);
				color: var(--ink);
				display: grid;
				place-items: center;
				cursor: pointer;
				transition:
					border-color 0.25s ease,
					transform 0.15s ease;
			}
			.play-fab:hover,
			.play-fab:focus-visible {
				border-color: rgba(242, 236, 225, 0.7);
			}
			.play-fab:focus-visible {
				outline: 1px solid var(--amber);
				outline-offset: 4px;
			}
			.play-fab:active {
				transform: translateX(-50%) scale(0.94);
			}
			.play-fab svg {
				width: 20px;
				height: 20px;
				display: block;
			}
			.play-fab .ic-pause {
				display: none;
			}
			.play-fab.is-playing .ic-play {
				display: none;
			}
			.play-fab.is-playing .ic-pause {
				display: block;
			}

			/* ---------- Petunjuk gesture ---------- */
			.gesture-hint {
				position: absolute;
				left: 50%;
				bottom: calc(6.45rem + env(safe-area-inset-bottom));
				z-index: 45;
				width: min(calc(100% - 3rem), 24rem);
				margin: 0;
				color: var(--dim);
				font-family: "Space Mono", monospace;
				font-size: 0.56rem;
				letter-spacing: 0.11em;
				line-height: 1.65;
				text-align: center;
				text-transform: uppercase;
				opacity: 0;
				pointer-events: none;
				transform: translate(-50%, 0.5rem);
				transition:
					opacity 0.45s ease,
					transform 0.45s ease;
			}
			.gesture-hint.is-visible {
				opacity: 1;
				transform: translate(-50%, 0);
			}
			@media (min-width: 700px) {
				.gesture-hint {
					display: none;
				}
			}

			/* ---------- Intro & penutup ---------- */
			.overlay {
				position: fixed;
				inset: 0;
				z-index: 200;
				display: grid;
				place-items: center;
				padding: 2rem;
				background: var(--bg);
				text-align: center;
				transition:
					opacity 0.9s ease,
					visibility 0.9s ease;
			}
			.overlay::before {
				content: "";
				position: absolute;
				inset: 0.9rem;
				border: 1px solid rgba(242, 236, 225, 0.09);
				pointer-events: none;
			}
			.overlay.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			.overlay-inner {
				position: relative;
				max-width: 30rem;
			}
			.intro-title {
				margin: 0 0 1.4rem;
				font-size: clamp(2.9rem, 13vw, 6.4rem);
				font-weight: 860;
				font-style: italic;
				line-height: 0.94;
				letter-spacing: -0.035em;
			}
			.intro-title .q {
				color: var(--amber);
			}
			.overlay-copy {
				margin: 0 auto 2.6rem;
				max-width: 21rem;
				font-weight: 340;
				font-size: 0.92rem;
				line-height: 1.75;
				color: var(--dim);
			}
			.cta {
				position: relative;
				min-height: 50px;
				padding: 0 2rem;
				border: 1px solid rgba(242, 236, 225, 0.4);
				border-radius: 999px;
				background: transparent;
				color: var(--ink);
				font-family: "Space Mono", monospace;
				font-size: 0.62rem;
				letter-spacing: 0.3em;
				text-transform: uppercase;
				cursor: pointer;
				transition:
					background 0.25s ease,
					color 0.25s ease,
					border-color 0.25s ease;
			}
			.cta:hover,
			.cta:focus-visible {
				background: var(--ink);
				border-color: var(--ink);
				color: #17100a;
			}
			.cta:focus-visible {
				outline: 1px solid var(--amber);
				outline-offset: 5px;
			}
			.cta::before,
			.cta::after {
				content: "";
				position: absolute;
				inset: -1px;
				border-radius: 999px;
				border: 1px solid var(--amber-soft);
				opacity: 0;
				pointer-events: none;
				animation: ring-pulse 3s ease-out infinite;
			}
			.cta::after {
				animation-delay: 1.5s;
			}
			@keyframes ring-pulse {
				0% {
					opacity: 0.45;
					transform: scale(1);
				}
				75%,
				100% {
					opacity: 0;
					transform: scale(1.4);
				}
			}
			.overlay-foot {
				position: absolute;
				left: 0;
				right: 0;
				bottom: calc(1.5rem + env(safe-area-inset-bottom));
				font-family: "Space Mono", monospace;
				font-size: 0.54rem;
				letter-spacing: 0.34em;
				text-transform: uppercase;
				color: var(--ghost);
			}
			.ending-quote {
				margin: 0 0 0.9rem;
				font-size: clamp(1.7rem, 7vw, 3.2rem);
				font-weight: 560;
				font-style: italic;
				line-height: 1.2;
				letter-spacing: -0.015em;
			}
			.quote-credit {
				margin: 0 0 2.4rem;
				font-size: 0.58rem;
				letter-spacing: 0.32em;
				text-transform: uppercase;
				color: var(--faint);
			}

			.main-ui {
				transition:
					opacity 0.8s ease,
					visibility 0.8s ease;
			}
			body:not(.experience-started) .main-ui {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			@media (prefers-reduced-motion: reduce) {
				.bg-video,
				.stack,
				.stack-viewport,
				.scene-card,
				.cta::before,
				.cta::after,
				.time-bubble {
					transition: none !important;
					animation: none !important;
				}
			}
		</style>
	</head>
	<body>
		<div class="stage">
			<video
				id="bg-video"
				class="bg-video scene-0"
				autoplay
				muted
				loop
				playsinline
				preload="auto"
				aria-hidden="true"
			>
				<source src="vidio.mp4" type="video/mp4" />
			</video>
			<div class="veil" aria-hidden="true"></div>

			<!-- Lirik: seluruh konten layar -->
			<main class="main-ui stack-viewport" aria-live="polite">
				<div class="stack" id="stack"></div>
			</main>

			<!-- Kartu judul bab -->
			<div class="scene-card main-ui" id="scene-card" aria-hidden="true">
				<div>
					<p class="kicker" id="card-kicker">00:00 · Verse</p>
					<h2 id="card-title">Colder Outside</h2>
				</div>
			</div>

			<!-- Strip progres: sentuh bagian untuk pindah bab, seret untuk mencari -->
			<nav
				class="strip main-ui"
				id="strip"
				aria-label="Progres lagu — sentuh untuk pindah bagian, seret untuk mencari"
			>
				<!-- aria-label tiap bagian diisi dari data `chapters` di skrip -->
				<button class="segment" type="button"><span class="segment-fill"></span></button>
				<button class="segment" type="button"><span class="segment-fill"></span></button>
				<button class="segment" type="button"><span class="segment-fill"></span></button>
			</nav>
			<div class="time-bubble" id="time-bubble">00:00</div>
			<p id="gesture-hint" class="gesture-hint main-ui" role="status">
				↔ Geser untuk berpindah bab · Tarik garis atas untuk mencari
			</p>

			<!-- Satu-satunya tombol -->
			<button
				id="play-fab"
				class="play-fab main-ui"
				type="button"
				aria-label="Putar musik"
				aria-pressed="false"
			>
				<svg
					class="ic-play"
					viewBox="0 0 20 20"
					fill="currentColor"
					aria-hidden="true"
				>
					<path
						d="M6 3.8v12.4c0 .8.9 1.3 1.6.9l9.6-6.2c.6-.4.6-1.4 0-1.8L7.6 2.9c-.7-.4-1.6.1-1.6.9z"
					/>
				</svg>
				<svg
					class="ic-pause"
					viewBox="0 0 20 20"
					fill="currentColor"
					aria-hidden="true"
				>
					<rect x="4.5" y="3" width="4" height="14" rx="1.4" />
					<rect x="11.5" y="3" width="4" height="14" rx="1.4" />
				</svg>
			</button>
		</div>

		<!-- Intro -->
		<section id="intro" class="overlay" aria-label="Pembuka">
			<div class="overlay-inner">
				<h1 class="intro-title">
					What if I call<span class="q">?</span>
				</h1>
				<p class="overlay-copy">Biarkan lagunya yang menelepon.</p>
				<button id="enter" class="cta" type="button">Dengarkan</button>
			</div>
			<div class="overlay-foot">
				Alex Crichton &middot; Merry Christmas, I Miss You
			</div>
		</section>

		<!-- Penutup -->
		<section
			id="ending"
			class="overlay is-hidden"
			aria-label="Penutup"
			aria-hidden="true"
		>
			<div class="overlay-inner">
				<p class="ending-quote">
					&ldquo;I miss you in waves,<br />and tonight I'm
					drowning.&rdquo;
				</p>
				<p class="quote-credit mono">&mdash; Denice Envall</p>
				<button id="replay" class="cta" type="button">
					Putar Lagi
				</button>
			</div>
		</section>

		<div class="scanlines" aria-hidden="true"></div>
		<div class="grain" aria-hidden="true"></div>

		<audio id="song" preload="metadata">
			<source src="song.mp3" type="audio/mpeg" />
		</audio>

		<script>
			/* ============ Data ============ */
			// Lirik dalam format enhanced LRC: [mm:ss.xx] = awal baris,
			// <mm:ss.xx> = awal tiap kata. Ini satu-satunya sumber teks & waktu
			// lirik; untuk memperbaiki sinkron cukup ubah angka di sini.
			const LRC = `
[ti:What If I Call]
[ar:Alex Crichton]
[al:Merry Christmas, i miss you]
[length:02:40]

[00:02.00] <00:02.00> So <00:03.00> what <00:04.00> if <00:05.00> I <00:06.00> call?

				if (!window.matchMedia("(max-width: 699px)").matches) return;
				try {
					if (sessionStorage.getItem("what-if-call-gesture-hint"))
						return;
					sessionStorage.setItem(
						"what-if-call-gesture-hint",
						"shown",
					);
				} catch (error) {
					// Tetap tampil bila penyimpanan browser tidak tersedia.
				}
				gestureHint.classList.add("is-visible");
				setTimeout(
					() => gestureHint.classList.remove("is-visible"),
					4600,
				);
			}

			enterBtn.addEventListener("click", () => {
				document.body.classList.add("experience-started");
				intro.classList.add("is-hidden");
				intro.setAttribute("aria-hidden", "true");
				bgVideo.play().catch(() => {});
				showSceneCard(0);
				setTimeout(showGestureHint, 2900);
				play();
			});

			function showEnding() {
				ending.classList.remove("is-hidden");
				ending.setAttribute("aria-hidden", "false");
				updatePlayUI(false);
			}

			replayBtn.addEventListener("click", () => {
				ending.classList.add("is-hidden");
				ending.setAttribute("aria-hidden", "true");
				song.currentTime = 0;
				lastActive = -1;
				showSceneCard(0);
				play();
			});

			/* ============ Media Session ============ */
			if ("mediaSession" in navigator) {
				navigator.mediaSession.metadata = new MediaMetadata({
					title: "What If I Call",
					artist: "Alex Crichton",
					album: "Merry Christmas, I Miss You",
					artwork: [
						{ src: "icon-512.png", sizes: "512x512", type: "image/png" },
					],
				});
				// Kontrol di lock screen / notifikasi. Bab = "lagu" berikut/sebelumnya.
				const seekTo = (sec) => {
					const d = song.duration;
					if (!Number.isFinite(d) || d <= 0) return;
					song.currentTime = Math.max(0, Math.min(d - 0.05, sec));
					syncAll(true);
					updateProgress();
				};
				const handlers = {
					play,
					pause: () => song.pause(),
					nexttrack: () => jumpToChapter(chapterIdx + 1),
					previoustrack: () => jumpToChapter(chapterIdx - 1),
					seekto: (details) => seekTo(details.seekTime),
					seekforward: (details) =>
						seekTo(song.currentTime + (details.seekOffset || 10)),
					seekbackward: (details) =>
						seekTo(song.currentTime - (details.seekOffset || 10)),
				};
				Object.entries(handlers).forEach(([action, handler]) => {
					try {
						navigator.mediaSession.setActionHandler(action, handler);
					} catch (error) {
						// Browser lama tidak mengenal semua aksi; lewati saja.
					}
				});
				// Posisi untuk bilah progres di lock screen.
				const updatePositionState = () => {
					if (!("setPositionState" in navigator.mediaSession)) return;
					const d = song.duration;
					if (!Number.isFinite(d) || d <= 0) return;
					try {
						navigator.mediaSession.setPositionState({
							duration: d,
							playbackRate: song.playbackRate,
							position: Math.min(song.currentTime, d),
						});
					} catch (error) {
						// Abaikan nilai posisi yang tidak valid.
					}
				};
				["loadedmetadata", "play", "pause", "seeked"].forEach((type) =>
					song.addEventListener(type, updatePositionState),
				);
			}

			/* ============ Init ============ */
			buildStack();
			setScene(0);
			chapterIdx = 0;
			window.addEventListener("resize", () => positionStack(false));
			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(() => positionStack(false));
			}
			updateLyrics();
		</script>
	</body>
</html>
